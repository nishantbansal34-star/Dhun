name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk Dhun.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Dhun-apk
          path: Dhun.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dhun (latest build)
          body: Download Dhun.apk below and open it on your phone to install or update.
          files: Dhun.apk
          make_latest: true
